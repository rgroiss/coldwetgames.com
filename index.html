<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101413" />
    <meta name="description" content="" />
    <title></title>
    <link rel="icon" href="assets/cold-and-wet-mountain-clean.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="localization.js" defer></script>
    <script src="interactions.js" defer></script>
  </head>
  <body>
    <div class="page-shell" id="top">
      <header class="site-header">
        <a
          class="brand-lockup"
          href="#top"
          data-i18n-attr="aria-label:brand.homeLabel"
        >
          <img
            class="brand-lockup__mark"
            src="assets/cold-and-wet-mountain-clean.png"
            alt=""
            data-i18n-attr="alt:brand.logoAlt"
          />
          <span class="brand-lockup__text" data-i18n="brand.headerName"></span>
        </a>

        <nav class="site-nav" data-i18n-attr="aria-label:navigation.label">
          <a class="site-nav__link" href="#work" data-i18n="navigation.work"></a>
          <a class="site-nav__link" href="#about" data-i18n="navigation.about"></a>
          <a class="site-nav__link" href="#contact" data-i18n="navigation.contact"></a>
        </nav>
      </header>

      <main>
        <section class="hero" aria-labelledby="studio-name">
          <h1 class="visually-hidden" id="studio-name" data-i18n="hero.heading"></h1>

          <figure class="hero-lockup" data-logo-motion data-reveal>
            <img
              class="hero-lockup__image"
              src="assets/cold-and-wet-mountain-clean.png"
              alt=""
              data-i18n-attr="alt:brand.logoAlt"
            />
          </figure>

          <div class="hero__copy" data-reveal>
            <p class="eyebrow" data-i18n="hero.eyebrow"></p>
            <p class="hero__intro" data-i18n="hero.intro"></p>

            <div class="status-notice" role="status">
              <span class="status-notice__dot" aria-hidden="true"></span>
              <span data-i18n="hero.status"></span>
            </div>
          </div>
        </section>

        <section class="section work" id="work" aria-labelledby="work-title" data-reveal>
          <div class="section-heading">
            <p class="eyebrow" data-i18n="work.eyebrow"></p>
            <h2 id="work-title" data-i18n="work.title"></h2>
            <p class="section-heading__intro" data-i18n="work.intro"></p>
          </div>

          <ol class="project-list">
            <li class="project project--ysiitu" data-project-card>
              <article class="project__body">
                <div
                  class="project__media project__media--pending"
                  role="img"
                  data-i18n-attr="aria-label:projects.yourSuffering.artAlt"
                >
                  <span data-i18n="projects.yourSuffering.artStatus"></span>
                </div>
                <div class="project__content">
                  <p class="project__meta" data-i18n="projects.yourSuffering.platform"></p>
                  <h3 data-i18n="projects.yourSuffering.title"></h3>
                  <p class="project__action project__action--static" data-i18n="projects.yourSuffering.action"></p>
                </div>
              </article>
            </li>

            <li class="project project--heavy-wake" data-project-card>
              <article class="project__body">
                <figure class="project__media">
                  <img
                    src="assets/projects/heavy-wake.jpg"
                    alt=""
                    data-i18n-attr="alt:projects.heavyWake.artAlt"
                  />
                </figure>
                <div class="project__content">
                  <p class="project__meta" data-i18n="projects.heavyWake.platform"></p>
                  <h3 data-i18n="projects.heavyWake.title"></h3>
                  <a
                    class="project__action"
                    href="https://store.steampowered.com/app/4235660/Heavy_Wake/"
                    target="_blank"
                    rel="noreferrer"
                    data-i18n="projects.heavyWake.action"
                    data-i18n-attr="aria-label:projects.heavyWake.ariaLabel"
                  ></a>
                </div>
                <div class="steam-widget">
                  <iframe
                    src="https://store.steampowered.com/widget/4235660/"
                    loading="lazy"
                    data-i18n-attr="title:projects.heavyWake.widgetTitle"
                  ></iframe>
                </div>
              </article>
            </li>

            <li class="project project--ueberdose" data-project-card>
              <article class="project__body">
                <figure class="project__media">
                  <img
                    src="assets/projects/uberdose.jpg"
                    alt=""
                    data-i18n-attr="alt:projects.ueberdose.artAlt"
                  />
                </figure>
                <div class="project__content">
                  <p class="project__meta" data-i18n="projects.ueberdose.platform"></p>
                  <h3 data-i18n="projects.ueberdose.title"></h3>
                  <a
                    class="project__action"
                    href="https://camel-eon.itch.io/uberdose"
                    target="_blank"
                    rel="noreferrer"
                    data-i18n="projects.ueberdose.action"
                    data-i18n-attr="aria-label:projects.ueberdose.ariaLabel"
                  ></a>
                </div>
              </article>
            </li>
          </ol>
        </section>

        <section class="section about" id="about" aria-labelledby="about-title" data-reveal>
          <div class="about__copy">
            <p class="eyebrow" data-i18n="about.eyebrow"></p>
            <h2 id="about-title" data-i18n="about.title"></h2>
            <p class="about__intro" data-i18n="about.intro"></p>
            <a
              class="text-link"
              href="mailto:contact@coldwetgames.com"
              data-i18n="about.contactAction"
            ></a>
          </div>

          <div class="portrait-placeholder" data-i18n-attr="aria-label:about.portraitAriaLabel">
            <p data-i18n="about.portraitLabel"></p>
            <span data-i18n="about.portraitCaption"></span>
          </div>
        </section>
      </main>

      <footer class="site-footer" id="contact">
        <span data-i18n="footer.copyright"></span>
        <a href="mailto:contact@coldwetgames.com" data-i18n="footer.email"></a>
      </footer>
    </div>
  </body>
</html>
