<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101413" />
    <meta name="description" content="" />
    <title></title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="localization.js" defer></script>
    <script src="interactions.js" defer></script>
  </head>
  <body>
    <div class="page-shell" id="top">
      <header class="site-header">
        <a
          class="brand-lockup"
          href="#top"
          data-i18n-attr="aria-label:brand.homeLabel"
        >
          <img
            class="brand-lockup__mark"
            src="assets/cold-and-wet-mountain.png"
            alt=""
            data-i18n-attr="alt:brand.logoAlt"
          />
          <span class="brand-lockup__text" data-i18n="brand.mark"></span>
        </a>

        <nav class="site-nav" data-i18n-attr="aria-label:navigation.label">
          <a class="site-nav__link" href="#work" data-i18n="navigation.work"></a>
          <a class="site-nav__link" href="#about" data-i18n="navigation.about"></a>
          <a class="site-nav__link" href="#contact" data-i18n="navigation.contact"></a>
        </nav>
      </header>

      <main>
        <section class="hero" aria-labelledby="studio-name">
          <div class="hero__copy" data-reveal>
            <p class="eyebrow" data-i18n="hero.eyebrow"></p>
            <h1 id="studio-name">
              <span class="hero__title-main" data-i18n="hero.titleMain"></span>
              <span class="hero__title-accent" data-i18n="hero.titleAccent"></span>
            </h1>
            <p class="hero__intro" data-i18n="hero.intro"></p>

            <div class="status-notice" role="status">
              <span class="status-notice__dot" aria-hidden="true"></span>
              <span data-i18n="hero.status"></span>
            </div>
          </div>

          <figure class="hero-mark" data-logo-motion data-reveal>
            <div class="hero-mark__frame" aria-hidden="true"></div>
            <img
              class="hero-mark__image"
              src="assets/cold-and-wet-mountain.png"
              alt=""
              data-i18n-attr="alt:brand.logoAlt"
            />
            <figcaption class="hero-mark__caption" data-i18n="hero.logoCaption"></figcaption>
          </figure>
        </section>

        <section class="section work" id="work" aria-labelledby="work-title" data-reveal>
          <div class="section-heading">
            <p class="eyebrow" data-i18n="work.eyebrow"></p>
            <h2 id="work-title" data-i18n="work.title"></h2>
            <p class="section-heading__intro" data-i18n="work.intro"></p>
          </div>

          <ol class="project-list">
            <li class="project-card project-card--ueberdose" data-project-card>
              <a
                class="project-card__link"
                href="https://camel-eon.itch.io/uberdose"
                target="_blank"
                rel="noreferrer"
                data-i18n-attr="aria-label:projects.ueberdose.ariaLabel"
              >
                <span class="project-card__title" data-i18n="projects.ueberdose.title"></span>
                <span class="project-card__meta" data-i18n="projects.ueberdose.platform"></span>
                <span class="project-card__action" data-i18n="projects.ueberdose.action"></span>
                <span class="project-card__arrow" aria-hidden="true"></span>
              </a>
            </li>

            <li class="project-card project-card--heavy-wake" data-project-card>
              <a
                class="project-card__link"
                href="https://store.steampowered.com/app/4235660/Heavy_Wake/"
                target="_blank"
                rel="noreferrer"
                data-i18n-attr="aria-label:projects.heavyWake.ariaLabel"
              >
                <span class="project-card__title" data-i18n="projects.heavyWake.title"></span>
                <span class="project-card__meta" data-i18n="projects.heavyWake.platform"></span>
                <span class="project-card__action" data-i18n="projects.heavyWake.action"></span>
                <span class="project-card__arrow" aria-hidden="true"></span>
              </a>
            </li>

            <li class="project-card project-card--forthcoming" data-project-card>
              <article
                class="project-card__link project-card__link--static"
                data-i18n-attr="aria-label:projects.yourSuffering.ariaLabel"
              >
                <span class="project-card__title" data-i18n="projects.yourSuffering.title"></span>
                <span class="project-card__meta" data-i18n="projects.yourSuffering.platform"></span>
                <span class="project-card__action" data-i18n="projects.yourSuffering.action"></span>
                <span class="project-card__arrow" aria-hidden="true"></span>
              </article>
            </li>
          </ol>
        </section>

        <section class="section about" id="about" aria-labelledby="about-title" data-reveal>
          <div class="about__copy">
            <p class="eyebrow" data-i18n="about.eyebrow"></p>
            <h2 id="about-title" data-i18n="about.title"></h2>
            <p class="about__intro" data-i18n="about.intro"></p>
            <a
              class="text-link"
              href="mailto:contact@coldwetgames.com"
              data-i18n="about.contactAction"
            ></a>
          </div>

          <div class="portrait-placeholder" data-i18n-attr="aria-label:about.portraitAriaLabel">
            <div class="portrait-placeholder__mountain" aria-hidden="true"></div>
            <p data-i18n="about.portraitLabel"></p>
            <span data-i18n="about.portraitCaption"></span>
          </div>
        </section>
      </main>

      <footer class="site-footer" id="contact">
        <span data-i18n="footer.copyright"></span>
        <a href="mailto:contact@coldwetgames.com" data-i18n="footer.email"></a>
      </footer>
    </div>
  </body>
</html>
