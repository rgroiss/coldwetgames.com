<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111718" />
    <meta
      name="description"
      content="Cold and Wet Games is an independent game studio from Austria, founded by Roman Groiss."
    />
    <title>Cold and Wet Games</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="site" aria-labelledby="studio-name">
      <header class="masthead">
        <p class="eyebrow">Independent game studio &middot; Austria</p>
        <p class="site-mark" aria-hidden="true">CW//G</p>
      </header>

      <section class="hero">
        <h1 id="studio-name">
          <span class="title-main">Cold and Wet</span>
          <span class="title-accent">Games</span>
        </h1>
      </section>

      <section class="details" aria-label="Studio information">
        <p class="intro">
          Cold and Wet Games is an independent studio founded by game developer
          and artist Roman Groiss.
        </p>

        <div class="status" role="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span>This website is currently a work in progress.</span>
        </div>
      </section>

      <footer>
        <span>&copy; <span id="year">2026</span> Cold and Wet Games</span>
        <a href="mailto:contact@coldwetgames.com">contact@coldwetgames.com</a>
      </footer>
    </main>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
