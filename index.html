<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0c0e" />
  <meta name="description" content="" />
  <title></title>
  <link rel="icon" href="assets/cold-and-wet-mountain-clean.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="localization.js" defer></script>
  <script src="steam-project.js?v=2" defer></script>
</head>

<body>
  <a class="skip-link" href="#work" data-i18n="accessibility.skipToWork"></a>

  <div class="site-frame" id="top">
    <header class="site-header">
      <a class="wordmark" href="#top" data-i18n-attr="aria-label:brand.homeLabel">
        <span data-i18n="brand.headerName"></span>
      </a>

      <nav class="site-nav" data-i18n-attr="aria-label:navigation.label">
        <a href="#work" data-i18n="navigation.work"></a>
        <a href="#about" data-i18n="navigation.about"></a>
        <a href="#contact" data-i18n="navigation.contact"></a>
      </nav>
    </header>

    <main>
      <section class="masthead" aria-labelledby="studio-name">
        <div class="masthead__title">
          <p class="eyebrow" data-i18n="hero.eyebrow"></p>
          <h1 id="studio-name">
            <span class="masthead__title-main" data-i18n="hero.titleMain"></span>
            <span class="masthead__title-accent" data-i18n="hero.titleAccent"></span>
          </h1>
        </div>

        <div class="masthead__aside">
          <figure class="studio-mark">
            <img src="assets/cold-and-wet-mountain-clean.png" alt="" />
            <figcaption data-i18n="hero.markCaption"></figcaption>
          </figure>

          <div class="masthead__statement">
            <p data-i18n="hero.intro"></p>
            <p class="status-note">
              <span class="status-note__symbol" aria-hidden="true"></span>
              <span>
                <strong data-i18n="hero.statusLabel"></strong>
                <span data-i18n="hero.status"></span>
              </span>
            </p>
          </div>
        </div>
      </section>

      <section class="work-section" id="work" aria-labelledby="work-title">
        <header class="work-heading">
          <p class="eyebrow" data-i18n="work.eyebrow"></p>
          <h2 id="work-title" data-i18n="work.title"></h2>
          <p data-i18n="work.intro"></p>
        </header>

        <div class="catalogue">
          <ol class="catalogue__records">
            <li class="catalogue-record">
              <article aria-labelledby="project-title-ysiitu" data-steam-app="5017960"
                data-steam-status="assets/steam/ysiitu.json">
                <p class="catalogue-record__number" data-i18n="projects.yourSuffering.number"></p>

                <div class="project-capsule project-capsule--slate" role="img" data-steam-pending
                  data-i18n-attr="aria-label:projects.yourSuffering.artAlt">
                  <strong data-i18n="projects.yourSuffering.capsuleTitle"></strong>
                  <span data-i18n="projects.yourSuffering.mediaState"></span>
                </div>

                <a class="project-capsule"
                  href="https://store.steampowered.com/app/5017960/Your_Suffering_Is_Important_to_Us/?utm_source=coldwetgames&utm_medium=website&utm_campaign=ysiitu_wishlist&utm_content=project_card"
                  target="_blank" rel="noreferrer" hidden data-steam-live
                  data-i18n-attr="aria-label:projects.yourSuffering.steamAriaLabel">
                  <img alt="" loading="lazy" decoding="async" data-steam-image="assets/projects/ysiitu-steam-header.jpg"
                    data-i18n-attr="alt:projects.yourSuffering.steamArtAlt" />
                </a>

                <div class="catalogue-record__body">
                  <p class="catalogue-record__kicker" data-i18n="projects.yourSuffering.kicker"></p>
                  <h3 id="project-title-ysiitu" data-i18n="projects.yourSuffering.title"></h3>
                  <p class="catalogue-record__description" data-i18n="projects.yourSuffering.description"></p>
                </div>

                <div class="catalogue-record__meta">
                  <dl class="project-facts">
                    <div>
                      <dt data-i18n="projects.labels.state"></dt>
                      <dd>
                        <span data-steam-pending data-i18n="projects.yourSuffering.state"></span>
                        <span hidden data-steam-live data-i18n="projects.yourSuffering.steamState"></span>
                      </dd>
                    </div>
                    <div>
                      <dt data-i18n="projects.labels.context"></dt>
                      <dd data-i18n="projects.yourSuffering.context"></dd>
                    </div>
                    <div hidden data-steam-live>
                      <dt data-i18n="projects.labels.destination"></dt>
                      <dd data-i18n="projects.yourSuffering.destination"></dd>
                    </div>
                  </dl>

                  <p class="project-action project-action--static" data-steam-pending
                    data-i18n="projects.yourSuffering.action"></p>
                  <a class="project-action"
                    href="https://store.steampowered.com/app/5017960/Your_Suffering_Is_Important_to_Us/?utm_source=coldwetgames&utm_medium=website&utm_campaign=ysiitu_wishlist&utm_content=project_card"
                    target="_blank" rel="noreferrer" hidden data-steam-live
                    data-i18n="projects.yourSuffering.steamAction"
                    data-i18n-attr="aria-label:projects.yourSuffering.steamAriaLabel"></a>
                </div>
              </article>
            </li>

            <li class="catalogue-record">
              <article aria-labelledby="project-title-heavy-wake">
                <p class="catalogue-record__number" data-i18n="projects.heavyWake.number"></p>

                <a class="project-capsule" href="https://store.steampowered.com/app/4235660/Heavy_Wake/" target="_blank"
                  rel="noreferrer" data-i18n-attr="aria-label:projects.heavyWake.ariaLabel">
                  <img src="assets/projects/heavy-wake-steam-header.jpg" alt="" loading="lazy" decoding="async"
                    data-i18n-attr="alt:projects.heavyWake.artAlt" />
                </a>

                <div class="catalogue-record__body">
                  <p class="catalogue-record__kicker" data-i18n="projects.heavyWake.kicker"></p>
                  <h3 id="project-title-heavy-wake" data-i18n="projects.heavyWake.title"></h3>
                  <p class="catalogue-record__description" data-i18n="projects.heavyWake.description"></p>
                </div>

                <div class="catalogue-record__meta">
                  <dl class="project-facts">
                    <div>
                      <dt data-i18n="projects.labels.state"></dt>
                      <dd data-i18n="projects.heavyWake.state"></dd>
                    </div>
                    <div>
                      <dt data-i18n="projects.labels.destination"></dt>
                      <dd data-i18n="projects.heavyWake.destination"></dd>
                    </div>
                  </dl>

                  <a class="project-action" href="https://store.steampowered.com/app/4235660/Heavy_Wake/"
                    target="_blank" rel="noreferrer" data-i18n="projects.heavyWake.action"
                    data-i18n-attr="aria-label:projects.heavyWake.ariaLabel"></a>
                </div>
              </article>
            </li>

            <li class="catalogue-record">
              <article aria-labelledby="project-title-uberdose">
                <p class="catalogue-record__number" data-i18n="projects.uberDose.number"></p>

                <a class="project-capsule project-capsule--contain" href="https://camel-eon.itch.io/uberdose"
                  target="_blank" rel="noreferrer" data-i18n-attr="aria-label:projects.uberDose.ariaLabel">
                  <img src="assets/projects/uberdose.jpg" alt="" loading="lazy" decoding="async"
                    data-i18n-attr="alt:projects.uberDose.artAlt" />
                </a>

                <div class="catalogue-record__body">
                  <p class="catalogue-record__kicker" data-i18n="projects.uberDose.kicker"></p>
                  <h3 id="project-title-uberdose" data-i18n="projects.uberDose.title"></h3>
                  <p class="catalogue-record__description" data-i18n="projects.uberDose.description"></p>
                </div>

                <div class="catalogue-record__meta">
                  <dl class="project-facts">
                    <div>
                      <dt data-i18n="projects.labels.role"></dt>
                      <dd data-i18n="projects.uberDose.role"></dd>
                    </div>
                    <div>
                      <dt data-i18n="projects.labels.context"></dt>
                      <dd data-i18n="projects.uberDose.context"></dd>
                    </div>
                    <div>
                      <dt data-i18n="projects.labels.destination"></dt>
                      <dd data-i18n="projects.uberDose.destination"></dd>
                    </div>
                  </dl>

                  <a class="project-action" href="https://camel-eon.itch.io/uberdose" target="_blank" rel="noreferrer"
                    data-i18n="projects.uberDose.action" data-i18n-attr="aria-label:projects.uberDose.ariaLabel"></a>
                </div>
              </article>
            </li>
          </ol>

        </div>
      </section>

      <section class="about-section" id="about" aria-labelledby="about-title">
        <div class="about-section__copy">
          <p class="eyebrow" data-i18n="about.eyebrow"></p>
          <h2 id="about-title" data-i18n="about.title"></h2>
          <p data-i18n="about.intro"></p>
          <a class="text-link" href="mailto:contact@coldwetgames.com" data-i18n="about.contactAction"></a>
        </div>

        <figure class="portrait">
          <img src="assets/roman-groiss-portrait.jpg" alt="" loading="lazy" decoding="async"
            data-i18n-attr="alt:about.portraitAlt" />
        </figure>
      </section>
    </main>

    <footer class="site-footer" id="contact">
      <span data-i18n="footer.copyright"></span>
      <a href="mailto:contact@coldwetgames.com" data-i18n="footer.email"></a>
    </footer>
  </div>
</body>

</html>
