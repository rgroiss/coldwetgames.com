name: Publish YSIITU Steam page

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ysiitu-steam-publication
  cancel-in-progress: false

jobs:
  check-steam-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the live branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Steam publication state
        run: node scripts/sync-steam-project.mjs

      - name: Publish the detected Steam page
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The Steam page is not public yet."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/steam/ysiitu.json assets/projects/ysiitu-steam-header.jpg .github/workflows/sync-steam-page.yml
          git commit -m "Publish YSIITU Steam page [skip ci]"
          git push origin HEAD:main
